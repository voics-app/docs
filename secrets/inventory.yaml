# Voics secrets inventory: the single list of every secret on the platform.
#
# NO VALUES. This file records metadata only. Values live in GitHub org or
# environment secrets, then OpenBao KV v2, then Kubernetes Secrets (ADR-0006).
#
# The OpenBao bindings (mount, paths, keys, GitHub secret names) mirror
# gitops/secrets/inventory.yaml exactly. gitops is the source of truth: its CI
# fails when an ExternalSecret reads a key it does not list. When the two
# disagree, change gitops first, then copy the change here.
#
# After editing, run `pnpm secrets:render` and commit the regenerated
# secrets/README.md. CI fails when the two drift (`pnpm secrets:check`).
#
# Schema (validated by scripts/render-secrets.mjs):
#   id:           stable kebab-case identifier
#   name:         human name
#   category:     platform | cloudflare | openbao | auth | database | storage | runtime | ci | observability
#   purpose:      what it protects
#   consumers:    components or workflows that read it
#   env:          env var names it is injected as (P2), [] if none
#   github:       { scope: org | env:production | none, names: [GitHub secret names] }
#   openbao:      [{ path, key, github }] one binding per OpenBao KV key. path is relative
#                 to `mount`, key is upper-case, github is one of this entry's github.names.
#                 [] when the value is never stored in OpenBao.
#   kubernetes:   [{ namespace, secret }] | []  (materialised by External Secrets Operator)
#   owner:        accountable person or team
#   rotation:     { interval: e.g. 90d | 180d | 365d | on-compromise | on-use, procedure: runbook anchor }
#   generate:     how to create a new value (command, never a value)
#   notes:        optional

version: 1
mount: kv

secrets:
  # ---------------------------------------------------------------- cloudflare
  - id: cloudflare-api-token
    name: Cloudflare API token
    category: cloudflare
    purpose: Manages DNS records, the Voics tunnel and Access applications in the voics.nl zone.
    consumers: [bootstrap/40-cloudflare.sh, regionctl, WS9 bring-up]
    env: [CLOUDFLARE_API_TOKEN]
    github: { scope: org, names: [CLOUDFLARE_API_TOKEN] }
    openbao: []
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#cloudflare-api-token" }
    generate: "Cloudflare dashboard > My Profile > API Tokens > Create (Zone:DNS:Edit, Account:Cloudflare Tunnel:Edit, Account:Access: Apps and Policies:Edit), scoped to voics.nl"
    notes: Scope to the voics.nl zone only. It must never be able to change the existing voics.nl / app.voics.nl records outside the discordy-* names (enforced by convention and review).

  - id: cloudflared-credentials
    name: Cloudflare tunnel credentials (locally managed tunnel)
    category: cloudflare
    purpose: Credentials JSON for the locally managed tunnel discordy-gen-serv. cloudflared reads it from a file and dials out to Cloudflare.
    consumers: [cloudflared]
    env: []
    github: { scope: env:production, names: [CLOUDFLARED_CREDENTIALS_JSON] }
    openbao: [{ path: discordy/cloudflared, key: CREDENTIALS_JSON, github: CLOUDFLARED_CREDENTIALS_JSON }]
    kubernetes: [{ namespace: voics-system, secret: cloudflared-credentials }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#cloudflare-tunnel-credentials" }
    generate: "bootstrap/40-cloudflare.sh creates the tunnel and stores its credentials JSON (see cloudflare-setup.md)"
    notes: The tunnel is locally managed, so ingress rules live in the gitops ConfigMap and the credentials JSON is the only tunnel secret. Mounted at /etc/cloudflared/creds/credentials.json.

  # ---------------------------------------------------------------- openbao
  - id: openbao-unseal-keys
    name: OpenBao unseal key shares
    category: openbao
    purpose: Unseal OpenBao after every restart (Shamir, 5 shares, threshold 3).
    consumers: [platform admin]
    env: []
    github: { scope: none, names: [] }
    openbao: []
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: on-compromise, procedure: "openbao-unseal.md#rekeying" }
    generate: "bao operator init -key-shares=5 -key-threshold=3 (once, at bring-up)"
    notes: Stored only in 1Password (vault "Discordy", items "OpenBao unseal key 1..5"). Never in GitHub, git or the cluster.

  - id: openbao-root-token
    name: OpenBao root token
    category: openbao
    purpose: Initial configuration of OpenBao (auth methods, policies, KV mount).
    consumers: [platform admin]
    env: []
    github: { scope: none, names: [] }
    openbao: []
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: on-use, procedure: "openbao-unseal.md#root-token" }
    generate: "Printed by bao operator init; regenerate with bao operator generate-root"
    notes: Stored only in 1Password. Revoked after bootstrap; regenerate from unseal shares when needed.

  # ---------------------------------------------------------------- auth
  - id: jwt-signing-key
    name: JWT signing key pair (Ed25519)
    category: auth
    purpose: Signs (private) and verifies (public) user access tokens (P3, alg EdDSA).
    consumers: [api (private), messages, gateway, voice-signaling, admin-bff (public)]
    env: [JWT_PRIVATE_KEY, JWT_PUBLIC_KEY]
    github: { scope: env:production, names: [API_JWT_PRIVATE_KEY, SHARED_JWT_PUBLIC_KEY] }
    openbao:
      - { path: discordy/api, key: JWT_PRIVATE_KEY, github: API_JWT_PRIVATE_KEY }
      - { path: discordy/shared, key: JWT_PUBLIC_KEY, github: SHARED_JWT_PUBLIC_KEY }
    kubernetes:
      - { namespace: voics-apps, secret: api-secrets }
      - { namespace: voics-apps, secret: admin-secrets }
      - { namespace: voics-apps, secret: gateway-secrets }
      - { namespace: voics-apps, secret: messages-secrets }
      - { namespace: voics-voice, secret: voice-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#jwt-signing-key" }
    generate: "openssl genpkey -algorithm ed25519 -out jwt.pem && openssl pkey -in jwt.pem -pubout -out jwt.pub.pem"
    notes: The public key is not confidential, but it travels with the pair so the two stay consistent. Only api receives the private key.

  - id: attachment-signing-key
    name: Attachment download signing key
    category: auth
    purpose: HMAC-SHA256 key that signs the expiring attachment download URLs (ex/is/hm) issued and verified by messages (ADR 0017).
    consumers: [messages]
    env: [ATTACHMENT_SIGNING_KEY]
    github: { scope: env:production, names: [MESSAGES_ATTACHMENT_SIGNING_KEY] }
    openbao: [{ path: discordy/messages, key: ATTACHMENT_SIGNING_KEY, github: MESSAGES_ATTACHMENT_SIGNING_KEY }]
    kubernetes:
      - { namespace: voics-apps, secret: messages-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#attachment-signing-key" }
    generate: "openssl rand -hex 32"
    notes: Dev reads kv/discordy-dev/messages with its own value. Rotating invalidates outstanding links; clients refresh by refetching messages. The local compose stack generates its own into local/.env.

  - id: apns-credentials
    name: Apple push (APNs) key, Key ID and Team ID
    category: auth
    purpose: Lets the notifier send push notifications to the iPhone app through APNs with token-based authentication (the .p8 signing key, its Key ID and the Apple Team ID).
    consumers: [notifier]
    env: [APNS_KEY_FILE, APNS_KEY_ID, APNS_TEAM_ID]
    github: { scope: env:production, names: [NOTIFIER_APNS_KEY, NOTIFIER_APNS_KEY_ID, NOTIFIER_APNS_TEAM_ID] }
    openbao:
      - { path: discordy/notifier, key: APNS_KEY, github: NOTIFIER_APNS_KEY }
      - { path: discordy/notifier, key: APNS_KEY_ID, github: NOTIFIER_APNS_KEY_ID }
      - { path: discordy/notifier, key: APNS_TEAM_ID, github: NOTIFIER_APNS_TEAM_ID }
    kubernetes:
      - { namespace: voics-apps, secret: notifier-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#apns-key" }
    generate: "Apple Developer, Certificates, Identifiers & Profiles, Keys: create a key with Apple Push Notifications service (APNs) enabled and download the .p8 once. The Key ID is shown next to the key; the Team ID is under Membership details. Owner action: nothing here can be generated."
    notes: "The notifier runs at 0 replicas until this path exists (runbooks/push-notifications.md). NOTIFIER_APNS_KEY holds the whole .p8 file, BEGIN and END lines included. One key serves sandbox and production. Dev reads kv/discordy-dev/notifier and 25-secrets.sh skips it: provide it the same way."

  - id: fcm-service-account
    name: Firebase service-account key (FCM)
    category: auth
    purpose: Lets the notifier send push notifications and call rings to the Android app through Firebase Cloud Messaging HTTP v1 (project voics-cf336).
    consumers: [notifier]
    env: [NOTIFIER_FCM_SERVICE_ACCOUNT]
    github: { scope: env:production, names: [NOTIFIER_FCM_SERVICE_ACCOUNT] }
    openbao:
      - { path: discordy/notifier-fcm, key: FCM_SERVICE_ACCOUNT, github: NOTIFIER_FCM_SERVICE_ACCOUNT }
    kubernetes:
      - { namespace: voics-apps, secret: notifier-fcm }
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#fcm-service-account-key" }
    generate: "Firebase console, Project settings, Service accounts, Generate new private key (project voics-cf336). Owner action: nothing here can be generated."
    notes: "Optional: the notifier starts without it and skips Android tokens. NOTIFIER_FCM_SERVICE_ACCOUNT holds the whole JSON file. Own OpenBao path so it can be provided independently of the APNs values; secrets-sync lists it under optional_paths and does not fail while it is unset. Dev reads kv/discordy-dev/notifier-fcm and 25-secrets.sh skips it: provide it the same way."

  - id: internal-service-token
    name: Internal service token
    category: auth
    purpose: Shared secret sent as X-Internal-Token on every /internal/* call between services.
    consumers: [api, messages, notifier, gateway, voice-signaling, admin-bff]
    env: [INTERNAL_SERVICE_TOKEN]
    github: { scope: env:production, names: [SHARED_INTERNAL_SERVICE_TOKEN] }
    openbao: [{ path: discordy/shared, key: INTERNAL_SERVICE_TOKEN, github: SHARED_INTERNAL_SERVICE_TOKEN }]
    kubernetes:
      - { namespace: voics-apps, secret: admin-secrets }
      - { namespace: voics-apps, secret: api-secrets }
      - { namespace: voics-apps, secret: gateway-secrets }
      - { namespace: voics-apps, secret: messages-secrets }
      - { namespace: voics-apps, secret: notifier-secrets }
      - { namespace: voics-voice, secret: voice-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#internal-service-token" }
    generate: "openssl rand -base64 48"

  - id: voice-token-secret
    name: Voice token secret (HS256)
    category: auth
    purpose: Signs (gateway) and verifies (voice-signaling) 60-second voice tokens (P3).
    consumers: [gateway, voice-signaling]
    env: [VOICE_TOKEN_SECRET]
    github: { scope: env:production, names: [SHARED_VOICE_TOKEN_SECRET] }
    openbao: [{ path: discordy/shared, key: VOICE_TOKEN_SECRET, github: SHARED_VOICE_TOKEN_SECRET }]
    kubernetes:
      - { namespace: voics-apps, secret: gateway-secrets }
      - { namespace: voics-voice, secret: voice-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#voice-token-secret" }
    generate: "openssl rand -base64 48"
    notes: Every region reads the same path. Rotating it affects every region at once, so roll the gateway and all voice nodes together.

  - id: voice-probe-token-secret
    name: Voice probe token signing key (prepared, inactive)
    category: auth
    purpose: Authenticates isolated synthetic voice probes; cannot authorize ordinary call tokens.
    consumers: [voice-prober, voice-signaling]
    env: [VOICE_PROBE_TOKEN_SECRET]
    github: { scope: none, names: [] }
    openbao: []
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "voice-regions/troubleshooting.md#prepared-active-health-probes" }
    generate: "After rollout approval: openssl rand -base64 48. Never reuse VOICE_TOKEN_SECRET."
    notes: Metadata only; no value, GitHub secret, OpenBao binding or Kubernetes Secret is created. Add the reviewed gitops binding before enabling the prepared prober. Missing key keeps probe admission disabled.

  - id: release-cookie
    name: Erlang distribution cookie
    category: runtime
    purpose: Authenticates gateway nodes to each other in the Erlang cluster (libcluster).
    consumers: [gateway]
    env: [RELEASE_COOKIE]
    github: { scope: env:production, names: [GATEWAY_RELEASE_COOKIE] }
    openbao: [{ path: discordy/gateway, key: RELEASE_COOKIE, github: GATEWAY_RELEASE_COOKIE }]
    kubernetes: [{ namespace: voics-apps, secret: gateway-secrets }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#release-cookie" }
    generate: "openssl rand -hex 32"

  - id: github-oauth
    name: GitHub OAuth app credentials
    category: auth
    purpose: Allows the api to verify ownership of linked GitHub accounts.
    consumers: [api]
    env: [CONNECTION_GITHUB_CLIENT_ID, CONNECTION_GITHUB_CLIENT_SECRET]
    github: { scope: env:production, names: [CONNECTION_GITHUB_CLIENT_ID, CONNECTION_GITHUB_CLIENT_SECRET] }
    openbao: [{ path: discordy/github-oauth, key: CLIENT_ID, github: CONNECTION_GITHUB_CLIENT_ID }, { path: discordy/github-oauth, key: CLIENT_SECRET, github: CONNECTION_GITHUB_CLIENT_SECRET }]
    kubernetes: [{ namespace: voics-apps, secret: api-github-oauth }]
    owner: "@oussamaelhajoui"
    rotation: { interval: on-change, procedure: "secret-rotation.md#github-oauth" }
    generate: Register a GitHub OAuth app with the exact public API callback, then obtain its client ID and secret.
    notes: Optional path; linking remains disabled until credentials are synced and the feature flag is explicitly enabled.

  - id: smtp-credentials
    name: SMTP credentials
    category: runtime
    purpose: Login for the mail server the api sends account emails through (verification, password reset, security notices). Without them the api uses the log transport and sends nothing.
    consumers: [api]
    env: [SMTP_USERNAME, SMTP_PASSWORD]
    github: { scope: env:production, names: [SMTP_USERNAME, SMTP_PASSWORD] }
    openbao: [{ path: discordy/smtp, key: SMTP_USERNAME, github: SMTP_USERNAME }, { path: discordy/smtp, key: SMTP_PASSWORD, github: SMTP_PASSWORD }]
    kubernetes: [{ namespace: voics-apps, secret: api-smtp }]
    owner: "@oussamaelhajoui"
    rotation: { interval: on-change, procedure: "secret-rotation.md" }
    generate: "Cloudflare Email Service: SMTP_USERNAME is the literal api_token, SMTP_PASSWORD is a Cloudflare API token with the Email Sending: Edit permission (runbooks/email-cloudflare.md). Any other provider: its SMTP user and password."
    notes: Owner action, tracked on docs#10. The api ConfigMap already carries SMTP_HOST, SMTP_PORT, SMTP_TLS and MAIL_FROM for Cloudflare; after the secret reaches OpenBao, flip MAIL_TRANSPORT to smtp (runbooks/email-cloudflare.md). The api-smtp secret is mounted optionally, so the api runs without it.

  - id: admin-allowed-emails
    name: Admin allowlist
    category: auth
    purpose: Emails allowed into the admin surfaces. admin-bff checks them as a second gate behind Cloudflare Access.
    consumers: [admin-bff]
    env: [ADMIN_ALLOWED_EMAILS]
    github: { scope: env:production, names: [ADMIN_ALLOWED_EMAILS] }
    openbao: [{ path: discordy/admin, key: ADMIN_ALLOWED_EMAILS, github: ADMIN_ALLOWED_EMAILS }]
    kubernetes: [{ namespace: voics-apps, secret: admin-secrets }]
    owner: "@oussamaelhajoui"
    rotation: { interval: on-change, procedure: "cloudflare-setup.md#cloudflare-access" }
    generate: "Edit the list; it must match the emails in the Cloudflare Access policy"
    notes: Not a credential, but it lives in the same flow. Keep it equal to the Access policy emails.

  - id: coturn-static-auth-secret
    name: coturn static auth secret
    category: runtime
    purpose: TURN REST shared secret. The gateway mints short-lived TURN credentials for P2P; coturn verifies them.
    consumers: [coturn, gateway]
    env: [TURN_STATIC_AUTH_SECRET]
    github: { scope: env:production, names: [COTURN_STATIC_AUTH_SECRET] }
    openbao: [{ path: discordy/coturn, key: STATIC_AUTH_SECRET, github: COTURN_STATIC_AUTH_SECRET }]
    kubernetes:
      - { namespace: voics-voice, secret: coturn }
      - { namespace: voics-apps, secret: gateway-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#generic-procedure" }
    generate: "openssl rand -hex 32"
    notes: Implied by the P2P design (spec §6.4) and added to P2 as TURN_STATIC_AUTH_SECRET.

  # ---------------------------------------------------------------- databases
  - id: postgres-app
    name: Postgres password for api (DB discordy)
    category: database
    purpose: Password of the discordy role that owns DB discordy, templated into DATABASE_URL.
    consumers: [api, CloudNativePG]
    env: [DATABASE_URL]
    github: { scope: env:production, names: [POSTGRES_APP_PASSWORD] }
    openbao: [{ path: discordy/postgres, key: APP_PASSWORD, github: POSTGRES_APP_PASSWORD }]
    kubernetes:
      - { namespace: voics-data, secret: postgres-app }
      - { namespace: voics-apps, secret: api-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#database-passwords" }
    generate: "openssl rand -base64 32 | tr -d '/+='"

  - id: postgres-admin
    name: Postgres password for admin-bff (DB discordy_admin)
    category: database
    purpose: Password of the discordy_admin role, templated into ADMIN_DATABASE_URL.
    consumers: [admin-bff, CloudNativePG]
    env: [ADMIN_DATABASE_URL]
    github: { scope: env:production, names: [POSTGRES_ADMIN_PASSWORD] }
    openbao: [{ path: discordy/postgres, key: ADMIN_PASSWORD, github: POSTGRES_ADMIN_PASSWORD }]
    kubernetes:
      - { namespace: voics-data, secret: postgres-admin }
      - { namespace: voics-apps, secret: admin-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#database-passwords" }
    generate: "openssl rand -base64 32 | tr -d '/+='"

  - id: valkey-password
    name: Valkey password
    category: database
    purpose: requirepass for Valkey, templated into VALKEY_URL.
    consumers: [valkey, api, gateway]
    env: [VALKEY_URL]
    github: { scope: env:production, names: [VALKEY_PASSWORD] }
    openbao: [{ path: discordy/valkey, key: PASSWORD, github: VALKEY_PASSWORD }]
    kubernetes:
      - { namespace: voics-data, secret: valkey }
      - { namespace: voics-apps, secret: api-secrets }
      - { namespace: voics-apps, secret: gateway-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#database-passwords" }
    generate: "openssl rand -base64 32 | tr -d '/+='"

  # ---------------------------------------------------------------- storage
  - id: minio-keys
    name: MinIO access keys
    category: storage
    purpose: S3 access keys for the MinIO object store, read by api (discordy-assets) and messages (discordy-attachments). The MinIO server reads the same pair for its own setup.
    consumers: [minio, api, messages]
    env: [MINIO_ACCESS_KEY, MINIO_SECRET_KEY]
    github: { scope: env:production, names: [MINIO_ACCESS_KEY, MINIO_SECRET_KEY] }
    openbao:
      - { path: discordy/minio, key: ACCESS_KEY, github: MINIO_ACCESS_KEY }
      - { path: discordy/minio, key: SECRET_KEY, github: MINIO_SECRET_KEY }
    kubernetes:
      - { namespace: voics-data, secret: minio }
      - { namespace: voics-apps, secret: api-secrets }
      - { namespace: voics-apps, secret: messages-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#minio-keys" }
    generate: "openssl rand -hex 16 (access key), openssl rand -base64 32 (secret key)"
    notes: One pair for every consumer, as gitops reads it. Scoped per-bucket service accounts are not in gitops yet.

  # ---------------------------------------------------------------- ci / github
  - id: ghcr-pull
    name: GHCR pull credentials
    category: ci
    purpose: Lets the cluster (kubelet imagePullSecret, Flux ImageRepository) read private images from GHCR.
    consumers: [kubelet, Flux image-reflector-controller]
    env: []
    github: { scope: org, names: [GHCR_USERNAME, GHCR_TOKEN] }
    openbao:
      - { path: discordy/ghcr, key: USERNAME, github: GHCR_USERNAME }
      - { path: discordy/ghcr, key: TOKEN, github: GHCR_TOKEN }
    kubernetes:
      - { namespace: voics-apps, secret: ghcr-pull }
      - { namespace: voics-voice, secret: ghcr-pull }
      - { namespace: flux-system, secret: ghcr-pull }
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#ghcr-pull-token" }
    generate: "GitHub > Settings > Developer settings > Fine-grained or classic PAT with read:packages only"

  - id: arc-github-token
    name: ARC GitHub token
    category: ci
    purpose: Lets Actions Runner Controller register the self-hosted runner scale set "discordy" with the org. Also used by secrets-sync, which runs on these runners.
    consumers: [actions-runner-controller]
    env: [github_token]
    github: { scope: org, names: [ARC_GITHUB_TOKEN] }
    openbao: [{ path: discordy/arc, key: GITHUB_TOKEN, github: ARC_GITHUB_TOKEN }]
    kubernetes: [{ namespace: voics-system, secret: arc-github }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#arc-github-credentials" }
    generate: "Classic PAT with admin:org scope"
    notes: "Bootstrap chicken-and-egg: secrets-sync runs on ARC, so bootstrap/20-openbao.sh seeds kv/discordy/arc from ARC_GITHUB_TOKEN during WS9 bring-up (openbao-unseal.md > First-time bootstrap)."

  - id: flux-deploy-key
    name: Flux deploy key
    category: ci
    purpose: SSH deploy key with write access to discordy-voics/gitops, used by Flux source and image automation.
    consumers: [Flux source-controller, image-automation-controller]
    env: []
    github: { scope: none, names: [] }
    openbao: []
    kubernetes: [{ namespace: flux-system, secret: flux-system }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#flux-deploy-key" }
    generate: "Created by flux bootstrap github; rotate by deleting the deploy key and re-running bootstrap"

  - id: notion-token
    name: Notion integration token
    category: ci
    purpose: Lets the notion-sync workflow mirror the docs repo into the Discordy Notion page tree on merge to main.
    consumers: [docs notion-sync workflow]
    env: [NOTION_TOKEN]
    github: { scope: org, names: [NOTION_TOKEN] }
    openbao: []
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#notion-token" }
    generate: "notion.so/my-integrations > New internal integration; share the Discordy page with it"

  - id: onepassword-service-account
    name: 1Password service account token
    category: ci
    purpose: Lets the `op` CLI store OpenBao init output in 1Password during bring-up and rekeying.
    consumers: [platform admin workstation]
    env: [OP_SERVICE_ACCOUNT_TOKEN]
    github: { scope: none, names: [] }
    openbao: []
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#generic-procedure" }
    generate: "1Password > Developer > Service accounts, write access to vault Discordy only"
    notes: Lives only in the admin's shell session; never in GitHub or the cluster.

  # ---------------------------------------------------------------- observability
  - id: grafana-admin
    name: Grafana admin password
    category: observability
    purpose: Grafana admin login.
    consumers: [grafana, platform admin]
    env: [GF_SECURITY_ADMIN_PASSWORD]
    github: { scope: env:production, names: [GRAFANA_ADMIN_PASSWORD] }
    openbao: [{ path: discordy/grafana, key: ADMIN_PASSWORD, github: GRAFANA_ADMIN_PASSWORD }]
    kubernetes: [{ namespace: observability, secret: grafana-admin }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#generic-procedure" }
    generate: "openssl rand -base64 24"
