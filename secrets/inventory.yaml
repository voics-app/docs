# Discordy secrets inventory: the single list of every secret on the platform.
#
# NO VALUES. This file records metadata only. Values live in GitHub org or
# environment secrets, then OpenBao KV v2, then Kubernetes Secrets (ADR-0006).
#
# After editing, run `pnpm secrets:render` and commit the regenerated
# secrets/README.md. CI fails when the two drift (`pnpm secrets:check`).
# The gitops repo's inventory check fails when an ExternalSecret references
# an OpenBao path/key that is not listed here.
#
# Schema (validated by scripts/render-secrets.mjs):
#   id:           stable kebab-case identifier
#   name:         human name
#   category:     platform | cloudflare | openbao | auth | database | storage | runtime | ci | observability
#   purpose:      what it protects
#   consumers:    components or workflows that read it
#   env:          env var names it is injected as (P2), [] if none
#   github:       { scope: org | env:production | none, names: [GitHub secret names] }
#   openbao:      { path: kv/discordy/<service>, keys: [..] } | null (never stored in OpenBao)
#   kubernetes:   [{ namespace, secret }] | []  (materialised by External Secrets Operator)
#   owner:        accountable person or team
#   rotation:     { interval: e.g. 90d | 180d | 365d | on-compromise, procedure: runbook anchor }
#   generate:     how to create a new value (command, never a value)
#   notes:        optional

version: 1

secrets:
  # ---------------------------------------------------------------- cloudflare
  - id: cloudflare-api-token
    name: Cloudflare API token
    category: cloudflare
    purpose: Manages DNS records, the Discordy tunnel and Access applications in the voics.nl zone.
    consumers: [gitops cloudflare workflow, regionctl, WS9 bring-up]
    env: [CLOUDFLARE_API_TOKEN]
    github: { scope: org, names: [CLOUDFLARE_API_TOKEN] }
    openbao: { path: kv/discordy/platform/cloudflare, keys: [api_token] }
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#cloudflare-api-token" }
    generate: "Cloudflare dashboard > My Profile > API Tokens > Create (Zone:DNS:Edit, Account:Cloudflare Tunnel:Edit, Account:Access: Apps and Policies:Edit), scoped to voics.nl"
    notes: Scope to the voics.nl zone only. It must never be able to change the existing voics.nl / app.voics.nl records outside the discordy-* names (enforced by convention and review).

  - id: cloudflare-tunnel-token
    name: Cloudflare tunnel token
    category: cloudflare
    purpose: Authenticates cloudflared to the Discordy tunnel.
    consumers: [cloudflared]
    env: [TUNNEL_TOKEN]
    github: { scope: env:production, names: [CLOUDFLARE_TUNNEL_TOKEN] }
    openbao: { path: kv/discordy/cloudflared, keys: [tunnel_token] }
    kubernetes: [{ namespace: voics-system, secret: cloudflared-tunnel }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#cloudflare-tunnel-token" }
    generate: "GET /accounts/{account_id}/cfd_tunnel/{tunnel_id}/token via the Cloudflare API (see cloudflare-setup.md)"

  - id: region-tunnel-tokens
    name: Region tunnel tokens
    category: cloudflare
    purpose: Authenticate cloudflared on standalone region clusters (one tunnel per region).
    consumers: [cloudflared on standalone region nodes]
    env: [TUNNEL_TOKEN]
    github: { scope: env:production, names: ["CLOUDFLARE_TUNNEL_TOKEN_<REGION>"] }
    openbao: { path: "kv/discordy/regions/<region>", keys: [tunnel_token] }
    kubernetes: [{ namespace: voics-system, secret: cloudflared-tunnel }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#cloudflare-tunnel-token" }
    generate: "regionctl add ... --standalone creates the tunnel and prints the GitHub secret name to fill"
    notes: Not needed for regions whose node joins the gen-serv cluster.

  # ---------------------------------------------------------------- openbao
  - id: openbao-unseal-keys
    name: OpenBao unseal key shares
    category: openbao
    purpose: Unseal OpenBao after every restart (Shamir, 5 shares, threshold 3).
    consumers: [platform admin]
    env: []
    github: { scope: none, names: [] }
    openbao: null
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: on-compromise, procedure: "openbao-unseal.md#rekeying" }
    generate: "bao operator init -key-shares=5 -key-threshold=3 (once, at bring-up)"
    notes: Stored only in 1Password (vault "Discordy", items "OpenBao unseal key 1..5"). Never in GitHub, git or the cluster.

  - id: openbao-root-token
    name: OpenBao root token
    category: openbao
    purpose: Initial configuration of OpenBao (auth methods, policies, KV mount).
    consumers: [platform admin]
    env: []
    github: { scope: none, names: [] }
    openbao: null
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: on-use, procedure: "openbao-unseal.md#root-token" }
    generate: "Printed by bao operator init; regenerate with bao operator generate-root"
    notes: Stored only in 1Password. Revoke after bootstrap; regenerate from unseal shares when needed.

  # ---------------------------------------------------------------- auth
  - id: jwt-signing-key
    name: JWT signing key pair (Ed25519)
    category: auth
    purpose: Signs (private) and verifies (public) user access tokens (P3, alg EdDSA).
    consumers: [api (private + public), messages, gateway, voice-signaling, admin-bff (public)]
    env: [JWT_PRIVATE_KEY, JWT_PUBLIC_KEY]
    github: { scope: env:production, names: [JWT_PRIVATE_KEY, JWT_PUBLIC_KEY] }
    openbao: { path: kv/discordy/common, keys: [jwt_private_key, jwt_public_key] }
    kubernetes:
      - { namespace: voics-apps, secret: api-secrets }
      - { namespace: voics-apps, secret: common-secrets }
      - { namespace: voics-voice, secret: common-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#jwt-signing-key" }
    generate: "openssl genpkey -algorithm ed25519 -out jwt.pem && openssl pkey -in jwt.pem -pubout -out jwt.pub.pem"
    notes: The public key is not confidential, but it travels with the pair so the two stay consistent. Only api receives the private key.

  - id: internal-service-token
    name: Internal service token
    category: auth
    purpose: Shared secret sent as X-Internal-Token on every /internal/* call between services.
    consumers: [api, messages, gateway, voice-signaling, admin-bff]
    env: [INTERNAL_SERVICE_TOKEN]
    github: { scope: env:production, names: [INTERNAL_SERVICE_TOKEN] }
    openbao: { path: kv/discordy/common, keys: [internal_service_token] }
    kubernetes:
      - { namespace: voics-apps, secret: common-secrets }
      - { namespace: voics-voice, secret: common-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#internal-service-token" }
    generate: "openssl rand -base64 48"

  - id: voice-token-secret
    name: Voice token secret (HS256)
    category: auth
    purpose: Signs (gateway) and verifies (voice-signaling) 60-second voice tokens (P3).
    consumers: [gateway, voice-signaling]
    env: [VOICE_TOKEN_SECRET]
    github: { scope: env:production, names: [VOICE_TOKEN_SECRET] }
    openbao: { path: kv/discordy/voice, keys: [voice_token_secret] }
    kubernetes:
      - { namespace: voics-apps, secret: gateway-secrets }
      - { namespace: voics-voice, secret: voice-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#voice-token-secret" }
    generate: "openssl rand -base64 48"
    notes: Every region reads the same path. Rotating it affects every region at once, so roll the gateway and all voice nodes together.

  - id: release-cookie
    name: Erlang distribution cookie
    category: runtime
    purpose: Authenticates gateway nodes to each other in the Erlang cluster (libcluster).
    consumers: [gateway]
    env: [RELEASE_COOKIE]
    github: { scope: env:production, names: [RELEASE_COOKIE] }
    openbao: { path: kv/discordy/gateway, keys: [release_cookie] }
    kubernetes: [{ namespace: voics-apps, secret: gateway-secrets }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#release-cookie" }
    generate: "openssl rand -hex 32"

  - id: coturn-static-auth-secret
    name: coturn static auth secret
    category: runtime
    purpose: TURN REST shared secret. The gateway mints short-lived TURN credentials for P2P; coturn verifies them.
    consumers: [coturn, gateway]
    env: [TURN_STATIC_AUTH_SECRET]
    github: { scope: env:production, names: [TURN_STATIC_AUTH_SECRET] }
    openbao: { path: kv/discordy/coturn, keys: [static_auth_secret] }
    kubernetes:
      - { namespace: voics-system, secret: coturn-secrets }
      - { namespace: voics-apps, secret: gateway-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#generic-procedure" }
    generate: "openssl rand -hex 32"
    notes: Implied by the P2P design (spec §6.4) but not yet pinned in P2. The coordinator should add TURN_STATIC_AUTH_SECRET to P2 before the gateway implements TURN credentials.

  # ---------------------------------------------------------------- databases
  - id: postgres-superuser
    name: Postgres superuser password
    category: database
    purpose: CloudNativePG superuser (postgres), used only for administration and restores.
    consumers: [CloudNativePG, platform admin]
    env: []
    github: { scope: env:production, names: [POSTGRES_SUPERUSER_PASSWORD] }
    openbao: { path: kv/discordy/postgres, keys: [superuser_password] }
    kubernetes: [{ namespace: voics-data, secret: postgres-superuser }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#database-passwords" }
    generate: "openssl rand -base64 32 | tr -d '/+='"

  - id: postgres-api
    name: Postgres password for api (DB discordy)
    category: database
    purpose: Credentials of the discordy role that owns DB discordy, templated into DATABASE_URL.
    consumers: [api]
    env: [DATABASE_URL]
    github: { scope: env:production, names: [POSTGRES_API_PASSWORD] }
    openbao: { path: kv/discordy/api, keys: [database_password, database_url] }
    kubernetes: [{ namespace: voics-apps, secret: api-secrets }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#database-passwords" }
    generate: "openssl rand -base64 32 | tr -d '/+='"

  - id: postgres-admin
    name: Postgres password for admin-bff (DB discordy_admin)
    category: database
    purpose: Credentials of the discordy_admin role, templated into ADMIN_DATABASE_URL.
    consumers: [admin-bff]
    env: [ADMIN_DATABASE_URL]
    github: { scope: env:production, names: [POSTGRES_ADMIN_PASSWORD] }
    openbao: { path: kv/discordy/admin, keys: [database_password, database_url] }
    kubernetes: [{ namespace: voics-apps, secret: admin-secrets }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#database-passwords" }
    generate: "openssl rand -base64 32 | tr -d '/+='"

  - id: valkey-password
    name: Valkey password
    category: database
    purpose: requirepass for Valkey, templated into VALKEY_URL.
    consumers: [valkey, api, gateway]
    env: [VALKEY_URL]
    github: { scope: env:production, names: [VALKEY_PASSWORD] }
    openbao: { path: kv/discordy/valkey, keys: [password, url] }
    kubernetes:
      - { namespace: voics-data, secret: valkey-auth }
      - { namespace: voics-apps, secret: api-secrets }
      - { namespace: voics-apps, secret: gateway-secrets }
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#database-passwords" }
    generate: "openssl rand -base64 32 | tr -d '/+='"

  # ---------------------------------------------------------------- storage
  - id: minio-root
    name: MinIO root credentials
    category: storage
    purpose: MinIO root user, used for bucket/policy management and the init job only.
    consumers: [minio, minio init job]
    env: [MINIO_ROOT_USER, MINIO_ROOT_PASSWORD]
    github: { scope: env:production, names: [MINIO_ROOT_USER, MINIO_ROOT_PASSWORD] }
    openbao: { path: kv/discordy/minio, keys: [root_user, root_password] }
    kubernetes: [{ namespace: voics-data, secret: minio-root }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#minio-keys" }
    generate: "openssl rand -hex 16 (user), openssl rand -base64 32 (password)"

  - id: minio-api-keys
    name: MinIO access keys for api
    category: storage
    purpose: Scoped to the discordy-assets bucket (avatars, icons, emoji).
    consumers: [api]
    env: [MINIO_ACCESS_KEY, MINIO_SECRET_KEY]
    github: { scope: env:production, names: [MINIO_API_ACCESS_KEY, MINIO_API_SECRET_KEY] }
    openbao: { path: kv/discordy/api, keys: [minio_access_key, minio_secret_key] }
    kubernetes: [{ namespace: voics-apps, secret: api-secrets }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#minio-keys" }
    generate: "mc admin user svcacct add --policy assets-rw.json discordy api"

  - id: minio-messages-keys
    name: MinIO access keys for messages
    category: storage
    purpose: Scoped to the discordy-attachments bucket.
    consumers: [messages]
    env: [MINIO_ACCESS_KEY, MINIO_SECRET_KEY]
    github: { scope: env:production, names: [MINIO_MESSAGES_ACCESS_KEY, MINIO_MESSAGES_SECRET_KEY] }
    openbao: { path: kv/discordy/messages, keys: [minio_access_key, minio_secret_key] }
    kubernetes: [{ namespace: voics-apps, secret: messages-secrets }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#minio-keys" }
    generate: "mc admin user svcacct add --policy attachments-rw.json discordy messages"

  - id: minio-updates-keys
    name: MinIO access keys for the update feed
    category: storage
    purpose: Write access to the updates bucket, used by the client release workflow to publish installers.
    consumers: [client release workflow (self-hosted runner)]
    env: [MINIO_ACCESS_KEY, MINIO_SECRET_KEY]
    github: { scope: org, names: [MINIO_UPDATES_ACCESS_KEY, MINIO_UPDATES_SECRET_KEY] }
    openbao: { path: kv/discordy/updates, keys: [minio_access_key, minio_secret_key] }
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#minio-keys" }
    generate: "mc admin user svcacct add --policy updates-rw.json discordy release"

  # ---------------------------------------------------------------- ci / github
  - id: ghcr-pull-token
    name: GHCR pull token
    category: ci
    purpose: Lets the cluster (kubelet imagePullSecret, Flux ImageRepository) read private images from GHCR.
    consumers: [kubelet, Flux image-reflector-controller]
    env: []
    github: { scope: org, names: [GHCR_PULL_TOKEN] }
    openbao: { path: kv/discordy/platform/ghcr, keys: [username, token] }
    kubernetes:
      - { namespace: voics-apps, secret: ghcr-pull }
      - { namespace: voics-voice, secret: ghcr-pull }
      - { namespace: flux-system, secret: ghcr-auth }
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#ghcr-pull-token" }
    generate: "GitHub > Settings > Developer settings > Fine-grained or classic PAT with read:packages only"

  - id: arc-github-app
    name: ARC GitHub App credentials
    category: ci
    purpose: Lets Actions Runner Controller register the self-hosted runner scale set "discordy" with the org.
    consumers: [actions-runner-controller]
    env: [github_app_id, github_app_installation_id, github_app_private_key]
    github: { scope: org, names: [ARC_GITHUB_APP_ID, ARC_GITHUB_APP_INSTALLATION_ID, ARC_GITHUB_APP_PRIVATE_KEY] }
    openbao: { path: kv/discordy/arc, keys: [github_app_id, github_app_installation_id, github_app_private_key] }
    kubernetes: [{ namespace: voics-system, secret: arc-github-app }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#arc-github-credentials" }
    generate: "Create a GitHub App on the org (Self-hosted runners: read/write, Administration: read) and generate a private key"
    notes: "Bootstrap chicken-and-egg: secrets-sync runs on ARC, so the first ARC secret is written to OpenBao by hand during WS9 bring-up (openbao-unseal.md > First-time bootstrap)."

  - id: arc-github-pat
    name: ARC GitHub PAT (fallback)
    category: ci
    purpose: Fallback runner registration if the GitHub App is not yet created.
    consumers: [actions-runner-controller]
    env: [github_token]
    github: { scope: org, names: [ARC_GITHUB_PAT] }
    openbao: { path: kv/discordy/arc, keys: [github_token] }
    kubernetes: [{ namespace: voics-system, secret: arc-github-app }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#arc-github-credentials" }
    generate: "Classic PAT with admin:org scope; delete once the App is in place"
    notes: Use either the App or the PAT, never both. Prefer the App.

  - id: flux-deploy-key
    name: Flux deploy key
    category: ci
    purpose: SSH deploy key with write access to discordy-voics/gitops, used by Flux source and image automation.
    consumers: [Flux source-controller, image-automation-controller]
    env: []
    github: { scope: none, names: [] }
    openbao: null
    kubernetes: [{ namespace: flux-system, secret: flux-system }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#flux-deploy-key" }
    generate: "Created by flux bootstrap github; rotate by deleting the deploy key and re-running bootstrap"

  - id: notion-token
    name: Notion integration token
    category: ci
    purpose: Lets the notion-sync workflow mirror the docs repo into the Discordy Notion page tree on merge to main.
    consumers: [docs notion-sync workflow]
    env: [NOTION_TOKEN]
    github: { scope: org, names: [NOTION_TOKEN] }
    openbao: null
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: 365d, procedure: "secret-rotation.md#notion-token" }
    generate: "notion.so/my-integrations > New internal integration; share the Discordy page with it"

  - id: onepassword-service-account
    name: 1Password service account token
    category: ci
    purpose: Lets the `op` CLI store OpenBao init output in 1Password during bring-up and rekeying.
    consumers: [platform admin workstation]
    env: [OP_SERVICE_ACCOUNT_TOKEN]
    github: { scope: none, names: [] }
    openbao: null
    kubernetes: []
    owner: "@oussamaelhajoui"
    rotation: { interval: 90d, procedure: "secret-rotation.md#generic-procedure" }
    generate: "1Password > Developer > Service accounts, write access to vault Discordy only"
    notes: Lives only in the admin's shell session; never in GitHub or the cluster.

  # ---------------------------------------------------------------- observability
  - id: grafana-admin
    name: Grafana admin credentials
    category: observability
    purpose: Grafana admin login.
    consumers: [grafana, platform admin]
    env: [GF_SECURITY_ADMIN_USER, GF_SECURITY_ADMIN_PASSWORD]
    github: { scope: env:production, names: [GRAFANA_ADMIN_PASSWORD] }
    openbao: { path: kv/discordy/grafana, keys: [admin_user, admin_password] }
    kubernetes: [{ namespace: observability, secret: grafana-admin }]
    owner: "@oussamaelhajoui"
    rotation: { interval: 180d, procedure: "secret-rotation.md#generic-procedure" }
    generate: "openssl rand -base64 24"
