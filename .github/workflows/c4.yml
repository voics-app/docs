name: c4

on:
  pull_request:
    paths: ["c4/**", "scripts/render-c4.sh", ".github/workflows/c4.yml"]
  push:
    branches: [develop, main]
    paths: ["c4/**", "scripts/render-c4.sh", ".github/workflows/c4.yml"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: c4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  render:
    runs-on: ${{ (vars.CI_RUNNER != '' && vars.CI_RUNNER != 'github' && !startsWith(vars.CI_RUNNER, 'ubuntu-') && !startsWith(vars.CI_RUNNER, 'windows-') && !startsWith(vars.CI_RUNNER, 'macos-') && vars.CI_RUNNER) || 'vm-runner' }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate workspace
        run: >
          docker run --rm -v "$PWD/c4:/c4" structurizr/cli:2025.11.09
          validate -workspace /c4/workspace.dsl

      - name: Render diagrams
        run: bash scripts/render-c4.sh

      - name: Fail pull requests with stale renders
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain c4/rendered)" ]; then
            git status --short c4/rendered
            echo "::error::c4/rendered is out of date. Run 'make render' and commit the result."
            exit 1
          fi

      - name: Commit re-rendered diagrams
        if: github.event_name != 'pull_request'
        run: |
          if [ -z "$(git status --porcelain c4/rendered)" ]; then
            echo "Rendered diagrams are up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add c4/rendered
          git commit -m "docs(c4): re-render diagrams [skip ci]"
          git push
