name: notion-sync

# Mirrors this repository into the existing Voics Notion root.
# Root/page identities are retained across the rename; see README "Notion mirror".
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: Plan only, change nothing in Notion
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: notion-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ${{ vars.CI_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # "Last updated" comes from git history
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # setup-node v5 auto-enables pnpm caching from package.json "packageManager" and then
          # fails because pnpm is not installed; the sync script has no dependencies to install.
          package-manager-cache: false
      - name: Sync to Notion
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          args=()
          if [ "$DRY_RUN" = "true" ]; then args+=(--dry-run); fi
          node scripts/notion-sync/index.mjs "${args[@]}"
